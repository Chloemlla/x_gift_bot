<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="csp-nonce" content="__XGIFT_NONCE__" />
    <style nonce="__XGIFT_NONCE__">
      :root {
        background: #f5f5f7;
        color-scheme: light;
      }
      :root[data-dark] {
        background: #111318;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-light]) {
          background: #111318;
          color-scheme: dark;
        }
      }
    </style>
    <script src="/appearance.js"></script>
    <meta
      name="description"
      content="XGift 兑换码管理：生成批次、下载兑换码并查看兑换状态。"
    />
    <title>XGift · 兑换码管理</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/admin.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>请启用 JavaScript 使用兑换码管理。</noscript>
  </body>
</html>
